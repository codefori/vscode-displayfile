name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX release
    runs-on: ubuntu-latest
    # Only run in this repo, not if this workflow file ever ends up merged
    # into an upstream/other fork - releases here shouldn't happen elsewhere.
    if: github.repository == 'danlong005/DSPF-Editor'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping. Bump the version in package.json to publish a new release."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.check.outputs.is-new == 'true'
        # No spaces in the filename - the release step below expands *.vsix
        # unquoted, and a space would get word-split into two arguments.
        run: npx @vscode/vsce package --out "DSPF-Editor-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub release
        if: steps.check.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" *.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSPF Editor $TAG" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: steps.check.outputs.is-new == 'true'
        run: npx @vscode/vsce publish --packagePath *.vsix -p "${{ secrets.VSCE_PAT }}"
